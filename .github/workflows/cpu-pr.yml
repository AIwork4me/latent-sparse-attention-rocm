name: "CPU checks (GitHub-hosted - safe for public fork PRs)"

# SECURITY CONTRACT (docs/SECURITY_RUNNER_POLICY.md):
# This is the ONLY workflow that runs for `pull_request` events, and it runs
# exclusively on GitHub-hosted ephemeral runners with zero repo secrets and
# read-only contents permission. Untrusted fork PR code is hostile; it gets
# lint, static checks and CPU-only unit/contract tests - never the persistent
# gfx1151 host, never a secret. GPU evidence comes only from the trusted
# GPU-regression workflow (push to main / confirmed dispatch).
on:
  pull_request:
  push:  # same-repo pushes get the same cheap CPU gate

permissions:
  contents: read

concurrency:
  group: cpu-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LSA_SKIP_GPU_TESTS: "1"  # GPU tests must SKIP loudly here, never silently pass
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: "Static guard: no public-PR route to a self-hosted runner may exist"
        run: |
          python -m pip install --quiet pyyaml
          python scripts/check_workflow_security.py
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Unit, contract and adversarial evidence tests (CPU; GPU tests skip loudly)
        run: python -m pytest tests/ -v -ra
