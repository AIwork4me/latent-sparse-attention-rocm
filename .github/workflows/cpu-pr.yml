name: "CPU checks (GitHub-hosted - safe for public fork PRs)"

# SECURITY CONTRACT (docs/SECURITY_RUNNER_POLICY.md):
# This is the ONLY workflow that runs for `pull_request` events, and it runs
# exclusively on GitHub-hosted ephemeral runners with zero repo secrets and
# read-only contents permission. Untrusted fork PR code is hostile; it gets
# lint, static checks and CPU-only unit/contract tests - never the persistent
# gfx1151 host, never a secret. GPU evidence comes only from the trusted
# GPU-regression workflow (push to main / confirmed dispatch).
on:
  pull_request:
  push:  # same-repo pushes get the same cheap CPU gate

permissions:
  contents: read

concurrency:
  group: cpu-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LSA_SKIP_GPU_TESTS: "1"  # GPU tests must SKIP loudly here, never silently pass
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: "Static guard: no public-PR route to a self-hosted runner may exist"
        run: |
          python -m pip install --quiet pyyaml
          python scripts/check_workflow_security.py
      - name: "Guard source pin: re-run the security check from a pinned reviewed commit (a fork PR cannot neuter it)"
        run: |
          # The check above runs from the PR's own checkout; a fork PR could
          # weaken the guard script in the same PR that adds an unsafe
          # workflow. This step re-runs the guard from a pinned, reviewed
          # commit SHA (not a mutable ref, and not origin/main - the guard
          # does not exist on main until PR #1 merges). Bump the pin only via
          # a reviewed change to the guard script.
          GUARD_SHA=2af35b973634a6344e856dd0f8b66ddba55b59a0
          git fetch --quiet origin "$GUARD_SHA"
          git show "$GUARD_SHA:scripts/check_workflow_security.py" > /tmp/guard_pinned.py
          python /tmp/guard_pinned.py "$GITHUB_WORKSPACE/.github/workflows"
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest numpy pyyaml
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet triton
      - name: Pin the upstream checkout (reviewed SHA; import-time dependency of the port)
        run: bash scripts/checkout_upstream.sh
      - name: Unit, contract and adversarial evidence tests (CPU; GPU tests skip loudly)
        run: python -m pytest tests/ -v -ra
